<mat-card>
  <mat-card-header>
    <mat-card-title>ვიდეოები</mat-card-title>
    <button mat-flat-button color="primary" (click)="openCreateDialog()">
      <mat-icon>add</mat-icon>
      ვიდეოს დამატება
    </button>
  </mat-card-header>
  <mat-card-content>
    <table mat-table [dataSource]="dataSource" class="full-width">
      <ng-container matColumnDef="title">
        <th mat-header-cell *matHeaderCellDef>სათაური</th>
        <td mat-cell *matCellDef="let row">{{ row.title }}</td>
      </ng-container>
      <ng-container matColumnDef="category">
        <th mat-header-cell *matHeaderCellDef>კატეგორია</th>
        <td mat-cell *matCellDef="let row">{{ row.category }}</td>
      </ng-container>
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>სტატუსი</th>
        <td mat-cell *matCellDef="let row">
          <mat-chip class="status-chip" [highlighted]="row.status === 'published'">
            {{ row.status }}
          </mat-chip>
        </td>
      </ng-container>
      <ng-container matColumnDef="youtubeId">
        <th mat-header-cell *matHeaderCellDef>YouTube ID</th>
        <td mat-cell *matCellDef="let row">{{ row.youtubeId }}</td>
      </ng-container>
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let row">
          <button mat-icon-button (click)="openEditDialog(row)"><mat-icon>edit</mat-icon></button>
          <button mat-icon-button color="warn" (click)="confirmDelete(row)"><mat-icon>delete</mat-icon></button>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </mat-card-content>
</mat-card>
